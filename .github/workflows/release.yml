# Release workflow of the agent-skills release skill, with the Release Build of the go-task
# profile. The documentation is rendered with this repository's own validator.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        uses: thst71/release-actions/verify-release-tag@a35ab4bfeaf3e592787fa3241cb41af99c5aa10a # main
        with:
          allowed-signers: ${{ secrets.RELEASE_ALLOWED_SIGNERS }}

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task typecheck format-check test validate-specs
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish
      - run: mkdir archives && mv dist/*.tar.gz dist/*.zip archives/ && rm -rf dist && mv archives dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: thst71/release-actions/render-docs@a35ab4bfeaf3e592787fa3241cb41af99c5aa10a # main
        with:
          version: ${{ needs.verify.outputs.version }}
          validator: go run ./cmd/spec-validator
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: |
            dist-docs/html/
            dist-docs/*.zip

  publish:
    needs: [verify, build, docs]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: thst71/release-actions/publish-release@a35ab4bfeaf3e592787fa3241cb41af99c5aa10a # main
        with:
          version: ${{ needs.verify.outputs.version }}
          prerelease: ${{ needs.verify.outputs.prerelease }}
          assets: |
            artifacts/dist/*
            artifacts/docs/html/*.html
            artifacts/docs/*.zip
