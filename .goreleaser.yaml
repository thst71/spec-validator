version: 2

project_name: spec-validator

builds:
  - main: ./cmd/spec-validator
    binary: spec-validator
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - COPYING
      - COPYING.LESSER
      - README.md

checksum:
  # publish-release of release-actions writes checksums.txt over all assets.
  disable: true

changelog:
  disable: true
